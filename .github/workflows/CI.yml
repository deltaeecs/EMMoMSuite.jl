name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

# 同一 ref 的连续推送取消旧 run（PR 迭代时避免排队堆积与重复计费）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── LTS 门禁：Fast Tests（Julia 1.10 × 3 平台）─────────────────────────────
  # Julia 1.12 存在已知多线程/覆盖率性能回归（JuliaLang/julia#59355、#60241、
  # #59936），Fast Tests 在 1.12 上比 1.10 慢 4~5 倍（Windows 21min vs 4.5min）。
  # 合并门禁以 LTS 1.10 为准；1.12 在 test-fast-latest 单独做非阻塞覆盖。
  test-fast:
    name: Fast Tests - Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
        os:
          - ubuntu-latest
          - windows-latest
          - macOS-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
      
      - uses: actions/cache@v3
        with:
          path: ~/.julia
          key: ${{ runner.os }}-julia-${{ matrix.version }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-${{ matrix.version }}-
      
      - uses: julia-actions/julia-buildpkg@v1
      
      - name: Run fast tests
        run: julia --project=. --color=yes --code-coverage=user test/runtests_fast.jl
        env:
          JULIA_NUM_THREADS: 2

  # ── 最新稳定（Julia 1.12）兼容性覆盖：ubuntu 单机，非必需检查 ─────────────
  test-fast-latest:
    name: Fast Tests - Julia latest (1.12) - ubuntu (informational)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1'
      
      - uses: actions/cache@v3
        with:
          path: ~/.julia
          key: ${{ runner.os }}-julia-1-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-1-
      
      - uses: julia-actions/julia-buildpkg@v1
      
      - name: Run fast tests
        run: julia --project=. --color=yes --code-coverage=user test/runtests_fast.jl
        env:
          JULIA_NUM_THREADS: 2
      
      - uses: julia-actions/julia-processcoverage@v1
      
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: fast-tests
          name: fast-tests-ubuntu-latest
          token: ${{ secrets.CODECOV_TOKEN }}
  
  test-medium:
    name: Medium Tests - Julia 1.x
    runs-on: ubuntu-latest
    needs: test-fast
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.10'

      # 依赖 depot 缓存（与 test-fast 同模式）：免每次全量预编译 24 个依赖
      - uses: actions/cache@v3
        with:
          path: ~/.julia
          key: ${{ runner.os }}-julia-1.10-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-1.10-
      
      - uses: julia-actions/julia-buildpkg@v1
      
      - name: Run medium tests
        run: julia --project=. --color=yes test/runtests_medium.jl
        env:
          JULIA_NUM_THREADS: 4
        timeout-minutes: 45
  
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # 不再 needs: test-fast：本作业是最长一环（原 20 min，含缓存后 ~15 min），
    # 立即并行启动可把 PR 关键路径从 5+20=25 min 压到 ~15-17 min。
    # 快速失败保护由 test-medium（needs: test-fast）与本作业 80% 硬门承担。
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.10'

      # 依赖 depot 缓存（与 test-fast 同模式）：免每次全量预编译
      - uses: actions/cache@v3
        with:
          path: ~/.julia
          key: ${{ runner.os }}-julia-1.10-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-1.10-
      
      - uses: julia-actions/julia-buildpkg@v1
      
      - name: Run tests with coverage (coverage suite)
        run: julia --project=. --color=yes --code-coverage=user test/runtests_cov.jl
        env:
          JULIA_NUM_THREADS: 2

      - name: Enforce 80% line coverage gate
        run: julia --project=. scripts/check_coverage.jl 80
      
      - uses: julia-actions/julia-processcoverage@v1
      
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: full-coverage
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
