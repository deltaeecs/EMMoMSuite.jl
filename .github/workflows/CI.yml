name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-fast:
    name: Fast Tests - Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'  # Minimum supported
          - '1'     # Current stable
        os:
          - ubuntu-latest
          - windows-latest
          - macOS-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
      
      - uses: actions/cache@v3
        with:
          path: ~/.julia
          key: ${{ runner.os }}-julia-${{ matrix.version }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-${{ matrix.version }}-
      
      - uses: julia-actions/julia-buildpkg@v1
      
      - name: Run fast tests
        run: julia --project=. --color=yes --code-coverage=user test/runtests_fast.jl
        env:
          JULIA_NUM_THREADS: 2
      
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
      
      - uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
        with:
          files: lcov.info
          flags: fast-tests
          name: fast-tests-${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
  
  test-medium:
    name: Medium Tests - Julia 1.x
    runs-on: ubuntu-latest
    needs: test-fast
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1'
      
      - uses: julia-actions/julia-buildpkg@v1
      
      - name: Run medium tests
        run: julia --project=. --color=yes test/runtests_medium.jl
        env:
          JULIA_NUM_THREADS: 4
        timeout-minutes: 45
  
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [test-fast, test-medium]
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1'
      
      - uses: julia-actions/julia-buildpkg@v1
      
      - name: Run tests with coverage (light suite)
        run: julia --project=. --color=yes --code-coverage=user test/runtests_light_cov.jl
        env:
          JULIA_NUM_THREADS: 2
      
      - uses: julia-actions/julia-processcoverage@v1
      
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: full-coverage
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
