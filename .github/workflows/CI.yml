name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-fast:
    name: Fast Tests - Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'  # LTS —— 必需门禁（分支保护只要求 1.10 三平台）
          - '1'     # 最新稳定（1.12.x），仅 ubuntu 非阻塞覆盖
        os:
          - ubuntu-latest
          - windows-latest
          - macOS-latest
        exclude:
          # Julia 1.12 存在已知多线程/覆盖率性能回归（JuliaLang/julia#59355、#60241、
          # #59936），Fast Tests 在 1.12 上比 1.10 慢 4~5 倍（Windows 21min vs 4.5min）。
          # 1.12 保留 ubuntu 单机做非阻塞兼容性覆盖；合并门禁以 LTS 1.10 为准。
          - version: '1'
            os: windows-latest
          - version: '1'
            os: macOS-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
      
      - uses: actions/cache@v3
        with:
          path: ~/.julia
          key: ${{ runner.os }}-julia-${{ matrix.version }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-${{ matrix.version }}-
      
      - uses: julia-actions/julia-buildpkg@v1
      
      - name: Run fast tests
        run: julia --project=. --color=yes --code-coverage=user test/runtests_fast.jl
        env:
          JULIA_NUM_THREADS: 2
      
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
      
      - uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
        with:
          files: lcov.info
          flags: fast-tests
          name: fast-tests-${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
  
  test-medium:
    name: Medium Tests - Julia 1.x
    runs-on: ubuntu-latest
    needs: test-fast
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.10'  # LTS（规避 1.12 覆盖率回归，原 22min -> 约 6min）
      
      - uses: julia-actions/julia-buildpkg@v1
      
      - name: Run medium tests
        run: julia --project=. --color=yes test/runtests_medium.jl
        env:
          JULIA_NUM_THREADS: 4
        timeout-minutes: 45
  
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [test-fast, test-medium]
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.10'  # LTS（规避 1.12 覆盖率回归，原 22min -> 约 6min）
      
      - uses: julia-actions/julia-buildpkg@v1
      
      - name: Run tests with coverage (coverage suite)
        run: julia --project=. --color=yes --code-coverage=user test/runtests_cov.jl
        env:
          JULIA_NUM_THREADS: 2

      - name: Enforce 80% line coverage gate
        run: julia --project=. scripts/check_coverage.jl 80
      
      - uses: julia-actions/julia-processcoverage@v1
      
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: full-coverage
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
