# ── volume (tetrahedral) cases ───────────────────────────────────────────────
# NOTE: volume (SWG/VEFIE) cases stay at their original frequencies — raising
# them would blow up the SWG unknown count beyond the dense-LU cross-check.
# Their MLFMA cross-check therefore remains in the near-field-dominated regime
# (documented in each report); the accuracy statement rests on the dense-LU /
# mesh-convergence comparison instead.
[[case]]
name        = "V1_sphere_VEFIE_Mie"
geo         = "sphere_r0p15.geo"
mesh_size   = 0.04
dim         = 3
freq        = 6.0e8
ie          = "auto"
theta_inc   = 1.5707963267948966
phi_inc     = 3.141592653589793
pol         = [0.0, 0.0, 1.0]
n_theta     = 181
phi_cuts    = [0.0, 1.5707963267948966]
mie_radius  = 0.15

[[case.region]]
surface  = "body"
material = "eps4p0"

[[case]]
name        = "V2_sphere_volume_PEC_fallback"
geo         = "sphere_r0p5.geo"
mesh_size   = 0.08
dim         = 3
freq        = 1.2e9
