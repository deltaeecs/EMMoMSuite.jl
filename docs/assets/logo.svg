<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e2a47"/>
      <stop offset="1" stop-color="#123a63"/>
    </linearGradient>
    <linearGradient id="sphere" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0" stop-color="#7fb3e6"/>
      <stop offset="1" stop-color="#2c6cb0"/>
    </linearGradient>
  </defs>

  <!-- rounded background -->
  <rect x="8" y="8" width="496" height="496" rx="96" fill="url(#bg)"/>

  <!-- incident plane wave (left) -->
  <g stroke="#ffd166" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.95">
    <line x1="52" y1="196" x2="132" y2="196"/>
    <polyline points="58,150 58,242" opacity="0.55"/>
    <polyline points="84,128 84,264" opacity="0.75"/>
    <polyline points="110,150 110,242" opacity="0.55"/>
  </g>
  <polygon points="132,182 160,196 132,210" fill="#ffd166"/>

  <!-- scattered wave arcs (right) -->
  <g stroke="#8fd3ff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M 392 256 a 24 24 0 0 1 0 0.01" />
    <path d="M 380 226 a 42 42 0 0 1 0 60" />
    <path d="M 402 200 a 72 72 0 0 1 0 112" />
    <path d="M 424 174 a 102 102 0 0 1 0 164" />
  </g>

  <!-- meshed sphere: latitude rings -->
  <g fill="none" stroke="#dceefc" stroke-width="3" opacity="0.9">
    <ellipse cx="276" cy="256" rx="128" ry="128"/>
    <ellipse cx="276" cy="256" rx="128" ry="92"/>
    <ellipse cx="276" cy="256" rx="128" ry="56"/>
    <ellipse cx="276" cy="256" rx="128" ry="22"/>
    <!-- longitude rings -->
    <ellipse cx="276" cy="256" rx="128" ry="128"/>
    <ellipse cx="276" cy="256" rx="92"  ry="128"/>
    <ellipse cx="276" cy="256" rx="56"  ry="128"/>
    <ellipse cx="276" cy="256" rx="22"  ry="128"/>
  </g>
  <!-- shaded fill under the wireframe -->
  <circle cx="276" cy="256" r="126" fill="url(#sphere)" opacity="0.85"/>
  <g fill="none" stroke="#eaf5ff" stroke-width="3" opacity="0.95">
    <ellipse cx="276" cy="256" rx="128" ry="128"/>
    <ellipse cx="276" cy="256" rx="128" ry="92"/>
    <ellipse cx="276" cy="256" rx="128" ry="56"/>
    <ellipse cx="276" cy="256" rx="128" ry="22"/>
    <ellipse cx="276" cy="256" rx="92" ry="128"/>
    <ellipse cx="276" cy="256" rx="56" ry="128"/>
    <ellipse cx="276" cy="256" rx="22" ry="128"/>
  </g>

  <!-- tetrahedron accent (volume discretization) -->
  <g transform="translate(390,392) scale(0.9)">
    <polygon points="0,-34 32,14 -30,22" fill="none" stroke="#ffd166" stroke-width="5" stroke-linejoin="round"/>
    <line x1="0" y1="-34" x2="1" y2="14" stroke="#ffd166" stroke-width="5"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="452" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700"
        fill="#ffffff" letter-spacing="2">EMMoMSuite</text>
</svg>
